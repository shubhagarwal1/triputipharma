<section class="showcase" id="showcase" #track>
  <div class="showcase__inner">
    <div class="showcase__heading" #heading>
      <span class="showcase__label">Built on Trust</span>
      <h2 class="showcase__title">A distribution network healthcare providers rely on</h2>
      <p class="showcase__subtitle">
        From a single Gurugram hub to four states — consistent availability, trusted brands,
        and a team that treats your supply like its own.
      </p>
    </div>

    <div class="showcase__card" #card>
      <div class="showcase__card-inner">
        <img
          src="/images/hero/trusted-partner.jpg"
          alt="Triputi Pharma — trusted pharmaceutical distribution partner"
          loading="lazy"
          decoding="async">
        <div class="showcase__card-overlay">
          <div class="showcase__stat"><strong>2000+</strong><span>Products</span></div>
          <div class="showcase__stat"><strong>13+</strong><span>Years</span></div>
          <div class="showcase__stat"><strong>4</strong><span>States</span></div>
        </div>
      </div>
      <button class="showcase__cta" type="button" (click)="scrollTo('catalogues')">
        Explore our product range
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>
</section>
