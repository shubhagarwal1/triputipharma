<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="navbar__container">
    <!-- Logo -->
    <a class="navbar__logo" routerLink="/" (click)="onLogoClick($event)">
      <span class="navbar__logo-monogram">TP</span>
      <span class="navbar__logo-text">
        <span class="navbar__logo-name">TRIPUTI</span>
        <span class="navbar__logo-tagline">PHARMA</span>
      </span>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="navbar__links">
      @for (link of navLinks; track link.target) {
        <li>
          <a class="navbar__link" (click)="navigateTo(link.target)">{{ link.label }}</a>
        </li>
      }
    </ul>

    <!-- CTA Button -->
    <a class="navbar__cta" href="tel:+919416608873">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span>Call Now</span>
    </a>

    <!-- Mobile Hamburger -->
    <button class="navbar__hamburger" [class.active]="isMobileMenuOpen()" (click)="toggleMobileMenu()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Menu Overlay -->
  @if (isMobileMenuOpen()) {
    <div class="navbar__mobile-overlay" (click)="closeMobileMenu()"></div>
    <div class="navbar__mobile-menu">
      <ul>
        @for (link of navLinks; track link.target) {
          <li>
            <a (click)="navigateTo(link.target)">{{ link.label }}</a>
          </li>
        }
      </ul>
      <a class="navbar__mobile-cta" href="tel:+919416608873">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call Now: +91 94166 08873
      </a>
    </div>
  }
</nav>
