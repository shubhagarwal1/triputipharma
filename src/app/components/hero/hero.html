<section class="hero" id="hero">
  <swiper-container #swiperEl init="false">
    @for (slide of slides; track slide.bgClass) {
      <swiper-slide>
        <div class="hero__slide" [class]="slide.bgClass">
          <div class="hero__overlay"></div>
          <div class="hero__content">
            <span class="hero__badge">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Trusted Since 2015
            </span>
            <h1 class="hero__title">{{ slide.title }}</h1>
            <p class="hero__subtitle">{{ slide.subtitle }}</p>
            <div class="hero__actions">
              <button class="hero__cta-primary" (click)="navigateTo(slide.target)">
                {{ slide.cta }}
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
              <a class="hero__cta-secondary" href="tel:+919717073873">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                Contact Us
              </a>
            </div>
          </div>
        </div>
      </swiper-slide>
    }
  </swiper-container>

  <div class="hero-pagination"></div>

  <!-- Scroll indicator -->
  <div class="hero__scroll-indicator" (click)="navigateTo('stats')">
    <div class="hero__scroll-mouse">
      <div class="hero__scroll-wheel"></div>
    </div>
    <span>Scroll Down</span>
  </div>
</section>
