<section class="catalogues" id="catalogues">
  <div class="catalogues__container">
    <div class="catalogues__header" data-aos="fade-up">
      <span class="catalogues__label">Our Products</span>
      <h2 class="catalogues__title">Product Catalogues</h2>
      <p class="catalogues__subtitle">
        Browse and download our complete product range. View detailed catalogues from our partner brands.
      </p>
    </div>

    <div class="catalogues__grid">
      @for (cat of catalogues; track cat.fileName; let i = $index) {
        <div class="catalogues__card" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="i * 80">
          <!-- Card Header -->
          <div class="catalogues__card-header" [style.background]="cat.gradient">
            <div class="catalogues__card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="m9 9.5 2 2 4-4"/></svg>
            </div>
            <span class="catalogues__card-brand">{{ cat.brand }}</span>
          </div>

          <!-- Card Body -->
          <div class="catalogues__card-body">
            <h3 class="catalogues__card-title">{{ cat.title }}</h3>
            <p class="catalogues__card-desc">{{ cat.description }}</p>

            <div class="catalogues__card-meta">
              <span class="catalogues__card-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
                {{ cat.fileSize }}
              </span>
              <span class="catalogues__card-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                {{ cat.pages }}
              </span>
            </div>

            <div class="catalogues__card-actions">
              <button class="catalogues__btn-view" (click)="viewPdf(cat.fileName)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                View PDF
              </button>
              <button class="catalogues__btn-download" (click)="downloadPdf(cat.fileName)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                Download
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
