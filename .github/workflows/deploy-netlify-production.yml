# Deploy the production site to Netlify on every push to `main`.
# Setup: add repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID (see README).
#
# If your site is ALSO connected in Netlify “Build & deploy → Link repository”,
# disable auto-builds there or disconnect Git — otherwise each push deploys twice.

name: Deploy production (Netlify)

on:
  push:
    branches:
      - main

concurrency:
  group: netlify-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=dist/triputi-pharma/browser --message "Deploy ${{ github.sha }}"
